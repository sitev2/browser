<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab" title="New tab (Ctrl+T)">+</button>
    </div>
    <div id="toolbar">
      <button id="back" title="Back" disabled>&#8592;</button>
      <button id="forward" title="Forward" disabled>&#8594;</button>
      <button id="reload" title="Reload">&#8635;</button>
      <button id="home" title="Home">&#8962;</button>
      <form id="address-form" autocomplete="off">
        <input id="address" type="text" placeholder="Search or enter address" spellcheck="false" />
      </form>
      <a id="open-external" title="Open this page in a new browser tab" target="_blank" rel="noopener noreferrer">Open in new tab</a>
    </div>
  </div>
  <div id="views">
    <div id="blocked" hidden>
      <p><strong>This site won't display here.</strong></p>
      <p>Many sites block being shown inside another page. Use "Open in new tab" to view it.</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
